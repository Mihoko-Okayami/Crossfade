[general]
# Viewer threads, 0 for one per CPU
workers 0
# Memory per stream and per output, in MiB, half of which must hold one keyframe interval
buffer 64
# Delay behind live before a viewer skips ahead, in ms, within what a quarter of buffer holds
lag 10000
# Seconds a viewer waits for a stream to start, 5 at most
wait 5
# Connections per viewer address (RTSP and .ts), 0 for no limit
clients 32

[srt]
# Address and port OBS streams to, 0.0.0.0:8890 if the host has no IPv6
listen [::]:8890
# Smallest AES key accepted, in bytes: 16, 24 or 32
keylen 32
# Time SRT keeps to resend lost packets, in ms, or OBS's latency if larger
latency 256
# Time without data before OBS counts as gone, in ms, 5000 at most
timeout 5000

[ts]
# MPEG-TS over HTTP, for an HTTPS frontend such as nginx
enabled yes
# Address and port the frontend connects to, keep it local
listen 127.0.0.1:8080
# Where viewers start, in ms behind live: 2000 for a picture at once, 0 at the edge, a quarter of buffer at most
backlog 2000

[rtsp]
# RTSP over TCP
enabled yes
# Address and port players connect to, 0.0.0.0:554 if the host has no IPv6
listen [::]:554
# Where viewers start, in ms behind live: 0 at the edge, a quarter of buffer at most
backlog 0
# yes makes players reconnect when OBS's video settings change
reconnect no

[offline]
# What viewers get while OBS is down, one line per stream:
# <stream, or * for all> <seconds to wait, always, or off> [video.ts, or none]
* 600
# * 600 /data/offline.ts
# mystream 600 /data/mystream_offline.ts

[streams]
# One line per stream: <name> <passphrase of 16 to 79 letters, digits, -, _, . or ~>
# The startup log says how many streams fit in memory
# Passphrase: tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64; echo
mystream
